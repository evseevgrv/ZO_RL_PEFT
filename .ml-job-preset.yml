job:
  time_limit: 168h
  flavor: h100-1x
  region: cloud-ru
  generate_name: zopeft
  description: ""
  image: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-devel
  # Upload only the code needed to run the job. Do NOT upload runtime
  # artifacts: llm_ft/offload (~768M weight shards) and llm_ft/logs (~74M)
  # blow past the gRPC 5MB message limit when bundled via `src: ./`.
  input:
  # repo root: pip install reads /workdir/requirements.txt
  # NOTE: for `type: files`, dst is the *directory* src is copied into.
  - type: files
    src: ./requirements.txt
    dst: /workdir
  # llm_ft code directories (dst = parent dir; each src dir lands as dst/<name>)
  - type: files
    src: ./llm_ft/configs
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/models
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/tasks
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/optimizers
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/gradient_pruning
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/scripts
    dst: /workdir/llm_ft
  # llm_ft loose source files (dst = parent dir they are copied into)
  - type: files
    src: ./llm_ft/run.py
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/trainer.py
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/training_utils.py
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/utils.py
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/k_utils.py
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/metrics.py
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/lora.py
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/templates.py
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/requirements.txt
    dst: /workdir/llm_ft
  args:
    - bash
    - -c
    - |
      apt-get update && \
      apt-get install -y --no-install-recommends git build-essential && \
      rm -rf /var/lib/apt/lists/* && \

      cd /workdir && \
      find . -name "*.sh" -exec sed -i 's/\r//' {} + && \
      pip install -r requirements.txt && \
      bash llm_ft/scripts/run_script.sh
