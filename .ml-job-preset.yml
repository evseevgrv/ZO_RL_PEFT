job:
  time_limit: 168h
  flavor: h100-1x
  region: cloud-ru
  generate_name: zopeft
  description: ""
  image: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-devel
  # Uploads the whole repo tree. Runtime artifacts that used to blow past the
  # gRPC 5MB message limit (llm_ft/offload ~768M, llm_ft/logs ~74M) now live
  # outside the repo (../ZO_RL_PEFT_artifacts) and are gitignored. mlc skips
  # .git automatically, so the upload is ~3MB.
  input:
  - type: files
    src: ./
    dst: /workdir
  args:
    - bash
    - -c
    - |
      apt-get update && \
      apt-get install -y --no-install-recommends git build-essential && \
      rm -rf /var/lib/apt/lists/* && \

      cd /workdir && \
      echo "===== /workdir contents =====" && ls -la /workdir && \
      pip install -r requirements.txt && \
      find . -name "*.sh" -exec sed -i 's/\r//' {} + && \
      bash llm_ft/scripts/run_script.sh
