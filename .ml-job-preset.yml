job:
  time_limit: 168h
  flavor: h100-1x
  region: cloud-ru
  generate_name: zopeft
  description: ""
  image: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-devel
  # Upload only the code needed to run the job. Do NOT upload runtime
  # artifacts: llm_ft/offload (~768M weight shards) and llm_ft/logs (~74M)
  # blow past the gRPC 5MB message limit when bundled via `src: ./`.
  input:
  # repo root: pip install reads /workdir/requirements.txt
  # NOTE: for `type: files`, dst is the *directory* src is copied into.
  - type: files
    src: ./requirements.txt
    dst: /workdir
  # llm_ft code directories (dst = parent dir; each src dir lands as dst/<name>)
  - type: files
    src: ./llm_ft/configs
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/models
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/tasks
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/optimizers
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/gradient_pruning
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/scripts
    dst: /workdir/llm_ft
  # llm_ft loose source files (dst = parent dir they are copied into)
  - type: files
    src: ./llm_ft/run.py
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/trainer.py
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/training_utils.py
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/utils.py
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/k_utils.py
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/metrics.py
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/lora.py
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/templates.py
    dst: /workdir/llm_ft
  - type: files
    src: ./llm_ft/requirements.txt
    dst: /workdir/llm_ft
  args:
    - bash
    - -c
    - |
      set -x
      apt-get update && \
      apt-get install -y --no-install-recommends git build-essential && \
      rm -rf /var/lib/apt/lists/*

      echo "===== DIAG: pwd ====="; pwd
      echo "===== DIAG: ls -la / ====="; ls -la /
      echo "===== DIAG: ls -la /workdir ====="; ls -la /workdir 2>&1
      echo "===== DIAG: find /workdir (maxdepth 4) ====="; find /workdir -maxdepth 4 2>&1 | sort
      echo "===== DIAG: requirements.txt anywhere under / (maxdepth 5) ====="; find / -maxdepth 5 -name requirements.txt 2>/dev/null
      echo "===== DIAG: run.py anywhere under / (maxdepth 5) ====="; find / -maxdepth 5 -name run.py 2>/dev/null
      echo "===== END DIAG ====="

      # Self-locate uploaded code (dst semantics of mlc `type: files` unclear)
      REQ="$(find /workdir -name requirements.txt 2>/dev/null | head -1)"
      RUNPY="$(find /workdir -name run.py 2>/dev/null | head -1)"
      echo "RESOLVED REQ=$REQ"
      echo "RESOLVED RUNPY=$RUNPY"

      if [ -z "$REQ" ] || [ -z "$RUNPY" ]; then
        echo "FATAL: code not found under /workdir — see DIAG above for actual layout"
        exit 1
      fi

      RUNDIR="$(dirname "$RUNPY")"
      pip install -r "$REQ" && \
      cd "$RUNDIR" && \
      find . -name "*.sh" -exec sed -i 's/\r//' {} + && \
      bash scripts/run_script.sh
